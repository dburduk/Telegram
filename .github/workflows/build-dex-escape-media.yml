name: Build DeX ESC media fix

on:
  push:
    branches: [ dex-escape-media-viewer ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Apply ESC media viewer fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('TMessagesProj/src/main/java/org/telegram/ui/PhotoViewer.java')
          text = path.read_text()
          old = '''        @Override
        public boolean dispatchKeyEvent(KeyEvent event) {
            int keyCode = event.getKeyCode();
            if (!muteVideo && sendPhotoType != SELECT_TYPE_AVATAR && isCurrentVideo && videoPlayer != null && event.getRepeatCount() == 0 && event.getAction() == KeyEvent.ACTION_DOWN && (event.getKeyCode() == KeyEvent.KEYCODE_VOLUME_UP || event.getKeyCode() == KeyEvent.KEYCODE_VOLUME_DOWN)) {
                videoPlayer.setVolume(1.0f);
            }
            return super.dispatchKeyEvent(event);
        }
'''
          new = '''        @Override
        public boolean dispatchKeyEvent(KeyEvent event) {
            int keyCode = event.getKeyCode();
            if (keyCode == KeyEvent.KEYCODE_ESCAPE && event.getAction() == KeyEvent.ACTION_UP) {
                if (textSelectionHelper.isInSelectionMode()) {
                    textSelectionHelper.clear();
                }
                if (isCaptionOpen()) {
                    closeCaptionEnter(true);
                    return true;
                }
                if (ContentPreviewViewer.getInstance().isVisible()) {
                    ContentPreviewViewer.getInstance().closeWithMenu();
                    return true;
                }
                PhotoViewer.getInstance().closePhoto(true, false);
                return true;
            }
            if (!muteVideo && sendPhotoType != SELECT_TYPE_AVATAR && isCurrentVideo && videoPlayer != null && event.getRepeatCount() == 0 && event.getAction() == KeyEvent.ACTION_DOWN && (event.getKeyCode() == KeyEvent.KEYCODE_VOLUME_UP || event.getKeyCode() == KeyEvent.KEYCODE_VOLUME_DOWN)) {
                videoPlayer.setVolume(1.0f);
            }
            return super.dispatchKeyEvent(event);
        }
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected dispatchKeyEvent block once, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- TMessagesProj/src/main/java/org/telegram/ui/PhotoViewer.java

      - name: Build debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' -print -exec cp {} out/telegram-dex-escape-media.apk \;
          test -f out/telegram-dex-escape-media.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-dex-escape-media
          path: out/telegram-dex-escape-media.apk
          if-no-files-found: error
