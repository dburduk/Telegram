name: Build DeX tablet fix APK

on:
  push:
    branches: [ dex-tablet-fix ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Apply DeX tablet patch
        run: git apply --check dex-tablet-fix.patch && git apply dex-tablet-fix.patch

      - name: Build debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' -print -exec cp {} out/telegram-dex-tablet-fix.apk \;
          test -f out/telegram-dex-tablet-fix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-dex-tablet-fix
          path: out/telegram-dex-tablet-fix.apk
          if-no-files-found: error
