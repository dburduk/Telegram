name: Build DeX tablet fix APK

on:
  push:
    branches: [ dex-tablet-fix ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Apply DeX split-view fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          launch = Path('TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java')
          text = launch.read_text()
          old = '!AndroidUtilities.isInMultiwindow && (!AndroidUtilities.isSmallTablet() || getResources().getConfiguration().orientation == Configuration.ORIENTATION_LANDSCAPE)'
          new = '(!AndroidUtilities.isInMultiwindow || getResources().getConfiguration().screenWidthDp >= 840) && (!AndroidUtilities.isSmallTablet() || getResources().getConfiguration().orientation == Configuration.ORIENTATION_LANDSCAPE)'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'Expected 3 LaunchActivity tablet split checks, found {count}')
          launch.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java

      - name: Build debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' -print -exec cp {} out/telegram-dex-tablet-fix-v2.apk \;
          test -f out/telegram-dex-tablet-fix-v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-dex-tablet-fix-v2
          path: out/telegram-dex-tablet-fix-v2.apk
          if-no-files-found: error
